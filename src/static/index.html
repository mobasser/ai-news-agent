<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Daily AI Briefing</title>
  <style>
    :root {
      --bg: #090e1e;
      --panel: rgba(255, 255, 255, 0.04);
      --border: rgba(255, 255, 255, 0.09);
      --text: #e6e9f2;
      --muted: #8b93a7;
      --accent: #7c5cff;
      --accent2: #22d3ee;
      --a: #22d3ee;
      --b: #f472b6;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(800px 500px at 10% -10%, rgba(124, 92, 255, 0.25), transparent 60%),
        radial-gradient(700px 500px at 110% 10%, rgba(34, 211, 238, 0.18), transparent 60%),
        linear-gradient(rgba(9, 14, 30, 0.82), rgba(9, 14, 30, 0.82)),
        url("/static/bg.gif") center center / 400px auto no-repeat,
        var(--bg);
      background-attachment: fixed;
    }
    .wrap { max-width: 1440px; margin: 0 auto; padding: 3rem 1.25rem 4rem; }
    header { text-align: center; margin-bottom: 2rem; }
    .badge {
      display: inline-flex; align-items: center; gap: 0.4rem;
      font-size: 0.75rem; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--accent2); border: 1px solid rgba(34, 211, 238, 0.35);
      padding: 0.3rem 0.75rem; border-radius: 999px;
    }
    .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--accent2); box-shadow: 0 0 10px var(--accent2); animation: pulse 1.6s infinite; }
    h1 {
      margin: 1rem 0 0.4rem; font-size: 2.4rem; font-weight: 700; letter-spacing: -0.02em;
      background: linear-gradient(90deg, #fff, #c4b5fd 45%, #67e8f9);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    .sub { color: var(--muted); margin: 0; }
    [hidden] { display: none !important; }
    .login { position: fixed; inset: 0; z-index: 10; display: grid; place-items: center; background: rgba(9, 14, 30, 0.85); backdrop-filter: blur(6px); }
    .login-card { width: min(360px, 90vw); display: flex; flex-direction: column; gap: 0.75rem; }
    .login-card h2 { margin: 0; font-size: 1.2rem; }
    .login-card input {
      padding: 0.75rem 0.9rem; border-radius: 10px; font-size: 1rem; color: var(--text);
      background: rgba(0, 0, 0, 0.3); border: 1px solid var(--border);
    }
    .login-card input:focus { outline: none; border-color: var(--accent); }
    .login-card .btn { min-height: 44px; }
    #logout { display: block; margin: 0.8rem auto 0; }
    .ai-red { color: #ef4444; -webkit-text-fill-color: #ef4444; background: none; }
    .card {
      background: var(--panel); border: 1px solid var(--border); border-radius: 18px;
      padding: 1.5rem; backdrop-filter: blur(12px); box-shadow: 0 20px 60px rgba(0, 0, 0, 0.35);
    }
    .input-row { display: flex; gap: 0.75rem; align-items: stretch; flex-wrap: wrap; }
    .chips { display: flex; flex-wrap: wrap; gap: 0.5rem; flex: 1; min-width: 260px; align-items: center;
      background: rgba(0, 0, 0, 0.25); border: 1px solid var(--border); border-radius: 12px; padding: 0.55rem 0.7rem; }
    .chip {
      display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.85rem;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.35), rgba(34, 211, 238, 0.25));
      border: 1px solid rgba(124, 92, 255, 0.5); padding: 0.25rem 0.6rem; border-radius: 999px;
    }
    .chip button { all: unset; cursor: pointer; color: var(--muted); font-size: 1rem; line-height: 1; }
    .chip button:hover { color: #fff; }
    #interest-input {
      all: unset; flex: 1; min-width: 140px; color: var(--text); font-size: 0.95rem; padding: 0.3rem 0.2rem;
    }
    #interest-input::placeholder { color: var(--muted); }
    .lang {
      min-height: 46px; padding: 0 0.8rem; border-radius: 10px; font-size: 0.9rem; cursor: pointer;
      background: rgba(0, 0, 0, 0.25); color: var(--text); border: 1px solid var(--border);
    }
    .lang option { background: var(--bg); color: var(--text); }
    .note { color: #fcd34d; font-size: 0.8rem; min-height: 1em; margin-top: 0.3rem; }
    .btn.ghost { min-height: 36px; padding: 0 1rem; margin-top: 0.5rem; font-size: 0.85rem; box-shadow: none; }
    .btn.ghost:before, .btn.ghost:after { display: none; }
    .btn.ghost { background: rgba(255, 255, 255, 0.08); border: 1px solid var(--border); }
    .line.now .text { background: #facc15; color: #111; border-radius: 6px; padding: 0.15rem 0.35rem; box-decoration-break: clone; -webkit-box-decoration-break: clone; }
    .line.now .avatar { transform: scale(1.1); transition: transform 0.2s; }
    .btn {
      border: none; outline: none; border-radius: 10px; padding: 0 1.4rem; min-height: 46px; font-size: 0.95rem; font-weight: 600;
      color: #fff; cursor: pointer; background: #111; position: relative; z-index: 0;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn:before {
      content: '';
      background: linear-gradient(45deg, #ff0000, #ff7300, #fffb00, #48ff00, #00ffd5, #002bff, #7a00ff, #ff00c8, #ff0000);
      position: absolute; top: -2px; left: -2px; background-size: 400%; z-index: -1; filter: blur(5px);
      width: calc(100% + 4px); height: calc(100% + 4px); animation: glowing 20s linear infinite;
      opacity: 0; transition: opacity .3s ease-in-out; border-radius: 10px;
    }
    .btn:after {
      z-index: -1; content: ''; position: absolute; width: 100%; height: 100%;
      background: #111; left: 0; top: 0; border-radius: 10px;
    }
    .btn:hover:not(:disabled):before { opacity: 1; }
    .btn:active:not(:disabled) { color: #000; }
    .btn:active:not(:disabled):after { background: transparent; }
    .btn:hover:not(:disabled) { transform: translateY(-1px); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; }
    @keyframes glowing {
      0% { background-position: 0 0; }
      50% { background-position: 400% 0; }
      100% { background-position: 0 0; }
    }
    .hint { color: var(--muted); font-size: 0.8rem; margin: 0.6rem 0 0; }
    .steps { display: none; margin-top: 1.5rem; gap: 0.5rem; }
    .steps.show { display: grid; grid-template-columns: repeat(2, 1fr); }
    .step {
      display: flex; align-items: center; gap: 0.6rem; padding: 0.7rem 0.8rem; border-radius: 12px;
      border: 1px solid var(--border); color: var(--muted); font-size: 0.85rem; transition: all 0.3s;
    }
    .step .ico {
      width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; flex: none;
      border: 1px solid var(--border); font-size: 0.75rem;
    }
    .step.active { color: var(--text); border-color: rgba(124, 92, 255, 0.6); background: rgba(124, 92, 255, 0.1); }
    .step.active .ico { border-color: var(--accent); animation: spin 1s linear infinite; border-top-color: transparent; }
    .step.done { color: var(--text); }
    .step.done .ico { background: #22c55e; border-color: #22c55e; color: #052e16; }
    .step.done .ico::before { content: "\2713"; font-weight: 700; }
    .error {
      margin-top: 1rem; padding: 0.8rem 1rem; border-radius: 12px; display: none;
      background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.4); color: #fca5a5; font-size: 0.9rem;
    }
    .error.show { display: block; }
    .result { margin-top: 1.5rem; display: none; }
    .result.show { display: block; animation: rise 0.5s ease both; }
    .player { display: flex; align-items: center; gap: 1rem; padding: 1.1rem 1.2rem; border-radius: 16px;
      background: linear-gradient(135deg, rgba(124, 92, 255, 0.18), rgba(34, 211, 238, 0.1)); border: 1px solid var(--border); }
    .orb {
      width: 52px; height: 52px; border-radius: 50%; flex: none;
      background: conic-gradient(from 0deg, var(--accent), var(--accent2), var(--b), var(--accent));
      animation: spin 6s linear infinite; box-shadow: 0 0 30px rgba(124, 92, 255, 0.5);
    }
    .player.playing .orb { animation-duration: 1.5s; }
    .player-meta { flex: 1; min-width: 0; }
    .player-meta .t { font-weight: 600; font-size: 1.05rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player-meta .s { color: var(--muted); font-size: 0.8rem; margin-bottom: 0.4rem; }
    audio { width: 100%; height: 36px; filter: invert(0.9) hue-rotate(180deg); opacity: 0.9; }
    h2 { font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.12em; color: var(--muted); font-weight: 600; margin: 1.8rem 0 0.8rem; }
    .line { display: flex; gap: 0.8rem; padding: 0.9rem 0; border-top: 1px solid var(--border); animation: rise 0.4s ease both; }
    .line:first-child { border-top: 0; }
    .avatar {
      width: 34px; height: 34px; border-radius: 10px; flex: none; display: grid; place-items: center;
      font-weight: 700; font-size: 0.85rem; color: #0b0f1a;
    }
    .a .avatar { background: var(--a); box-shadow: 0 0 16px rgba(34, 211, 238, 0.4); }
    .b .avatar { background: var(--b); box-shadow: 0 0 16px rgba(244, 114, 182, 0.4); }
    .who { font-size: 0.75rem; color: var(--muted); margin-bottom: 0.2rem; font-weight: 600; }
    .a .who { color: var(--a); }
    .b .who { color: var(--b); }
    .text { line-height: 1.55; color: #d6dbe8; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 50% { opacity: 0.3; } }
    @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    @media (max-width: 640px) { h1 { font-size: 1.9rem; } }
  </style>
</head>
<body>
  <div class="login" id="login" hidden>
    <form class="card login-card" id="login-form">
      <h2>Sign in</h2>
      <input id="login-user" type="text" placeholder="Username" autocomplete="username" required />
      <input id="login-pass" type="password" placeholder="Password" autocomplete="current-password" required />
      <button class="btn" type="submit">Sign in</button>
      <div class="error" id="login-error"></div>
    </form>
  </div>

  <div class="wrap">
    <header>
      <span class="badge"><span class="dot"></span> Live news &middot; AI powered</span>
      <h1>Daily <span class="ai-red">AI</span> Briefing</h1>
      <p class="sub">Pick your topics. Listen to today's news while you work.</p>
      <button class="btn ghost" type="button" id="logout" hidden>Sign out</button>
    </header>

    <div class="card">
      <form id="form">
        <div class="input-row">
          <div class="chips" id="chips">
            <input id="interest-input" type="text" placeholder="Add a topic and press Enter (e.g. AI, climate)" autocomplete="off" />
          </div>
          <select class="lang" id="language" aria-label="Briefing language">
            <option>English</option>
            <option>Spanish</option>
            <option>French</option>
            <option>German</option>
            <option>Portuguese</option>
            <option>Italian</option>
            <option>Hindi</option>
            <option>Arabic</option>
            <option>Chinese</option>
            <option>Japanese</option>
          </select>
          <button class="btn" type="submit" id="go" disabled>Generate briefing</button>
        </div>
        <p class="hint">Press Enter or comma to add a topic. Each briefing uses search, language model and voice credits.</p>
      </form>

      <div class="steps" id="steps">
        <div class="step" data-step="script"><span class="ico">1</span>Researching and writing</div>
        <div class="step" data-step="audio"><span class="ico">2</span>Recording voices</div>
      </div>
      <div class="error" id="error"></div>

      <div class="result" id="result">
        <div class="player" id="player-card">
          <div class="orb"></div>
          <div class="player-meta">
            <div class="t" id="title"></div>
            <div class="s" id="meta"></div>
            <audio id="player" controls></audio>
            <div class="note" id="note"></div>
            <button class="btn ghost" type="button" id="browser-btn" disabled>Browser voice</button>
          </div>
        </div>
        <h2>Transcript</h2>
        <div id="script"></div>
      </div>
    </div>
  </div>

  <script>
    const form = document.getElementById("form");
    const input = document.getElementById("interest-input");
    const chipsEl = document.getElementById("chips");
    const go = document.getElementById("go");
    const stepsEl = document.getElementById("steps");
    const errorEl = document.getElementById("error");
    const resultEl = document.getElementById("result");
    const titleEl = document.getElementById("title");
    const metaEl = document.getElementById("meta");
    const scriptEl = document.getElementById("script");
    const player = document.getElementById("player");
    const playerCard = document.getElementById("player-card");
    const browserBtn = document.getElementById("browser-btn");
    const noteEl = document.getElementById("note");
    const AUDIO_TIMEOUT_MS = 45000;
    const LANG_CODES = { English: "en-US", Spanish: "es-ES", French: "fr-FR", German: "de-DE", Portuguese: "pt-BR", Italian: "it-IT", Hindi: "hi-IN", Arabic: "ar-SA", Chinese: "zh-CN", Japanese: "ja-JP" };
    let interests = [];
    let lastBriefing = null;
    let lastLanguage = "English";
    let lineStarts = [];
    let currentLine = -1;

    function highlight(idx) {
      if (idx === currentLine) return;
      currentLine = idx;
      const rows = scriptEl.querySelectorAll(".line");
      rows.forEach((r, i) => r.classList.toggle("now", i === idx));
      if (rows[idx] && document.activeElement !== input) rows[idx].scrollIntoView({ behavior: "smooth", block: "center" });
    }

    async function loadSegments(segments) {
      const blobs = segments.map((b64) => new Blob([Uint8Array.from(atob(b64), (c) => c.charCodeAt(0))], { type: "audio/mpeg" }));
      const durations = await Promise.all(blobs.map((blob) => new Promise((resolve) => {
        const probe = new Audio(URL.createObjectURL(blob));
        probe.onloadedmetadata = () => { URL.revokeObjectURL(probe.src); resolve(probe.duration); };
        probe.onerror = () => resolve(0);
      })));
      let t = 0;
      lineStarts = durations.map((d) => { const s = t; t += d; return s; });
      player.src = URL.createObjectURL(new Blob(blobs, { type: "audio/mpeg" }));
    }

    function getVoices() {
      return new Promise((resolve) => {
        const voices = speechSynthesis.getVoices();
        if (voices.length) return resolve(voices);
        speechSynthesis.onvoiceschanged = () => resolve(speechSynthesis.getVoices());
        setTimeout(() => resolve(speechSynthesis.getVoices()), 1000);
      });
    }

    async function speakInBrowser(briefing, language) {
      if (!("speechSynthesis" in window)) throw new Error("This browser does not support speech synthesis");
      speechSynthesis.cancel();
      const lang = LANG_CODES[language] || "en-US";
      const voices = await getVoices();
      const matching = voices.filter((v) => v.lang.toLowerCase().startsWith(lang.slice(0, 2).toLowerCase()));
      const pool = matching.length ? matching : voices;
      const anna = pool[0];
      const sam = pool[1] || pool[0];
      const rows = [...scriptEl.querySelectorAll(".line")];
      const clearNow = () => rows.forEach((r) => r.classList.remove("now"));
      briefing.script.forEach((line, i) => {
        const isAnna = line.speaker === "Agent Anna";
        const u = new SpeechSynthesisUtterance(line.text);
        u.lang = lang;
        u.voice = isAnna ? anna : sam;
        u.pitch = isAnna ? 1.1 : 0.9;
        u.onstart = () => highlight(i);
        u.onend = () => { if (i === briefing.script.length - 1) clearNow(); };
        speechSynthesis.speak(u);
      });
    }

    function renderChips() {
      chipsEl.querySelectorAll(".chip").forEach((c) => c.remove());
      interests.forEach((topic, i) => {
        const chip = document.createElement("span");
        chip.className = "chip";
        chip.textContent = topic;
        const x = document.createElement("button");
        x.type = "button";
        x.textContent = "\u00d7";
        x.addEventListener("click", () => { interests.splice(i, 1); renderChips(); });
        chip.append(x);
        chipsEl.insertBefore(chip, input);
      });
      go.disabled = interests.length === 0;
    }

    function addFromInput() {
      const topic = input.value.replace(/,/g, "").trim();
      if (topic && !interests.includes(topic)) interests.push(topic);
      input.value = "";
      renderChips();
    }

    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === ",") { e.preventDefault(); addFromInput(); }
      if (e.key === "Backspace" && !input.value && interests.length) { interests.pop(); renderChips(); }
    });
    input.addEventListener("blur", addFromInput);
    chipsEl.addEventListener("click", () => input.focus());

    function setStep(name) {
      const order = ["script", "audio"];
      const idx = order.indexOf(name);
      stepsEl.querySelectorAll(".step").forEach((el) => {
        const i = order.indexOf(el.dataset.step);
        el.classList.toggle("done", i < idx);
        el.classList.toggle("active", i === idx);
      });
    }

    function finishSteps() {
      stepsEl.querySelectorAll(".step").forEach((el) => { el.classList.remove("active"); el.classList.add("done"); });
    }

    const loginEl = document.getElementById("login");
    const loginForm = document.getElementById("login-form");
    const loginError = document.getElementById("login-error");
    const logoutBtn = document.getElementById("logout");

    function showLogin() {
      loginEl.hidden = false;
      logoutBtn.hidden = true;
      document.getElementById("login-user").focus();
    }

    function showApp() {
      loginEl.hidden = true;
      logoutBtn.hidden = false;
    }

    async function checkSession() {
      const res = await fetch("/api/auth/session");
      res.ok ? showApp() : showLogin();
    }

    loginForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      loginError.textContent = "";
      try {
        await post("/api/auth/login", {
          username: document.getElementById("login-user").value,
          password: document.getElementById("login-pass").value,
        });
        document.getElementById("login-pass").value = "";
        showApp();
      } catch (err) {
        loginError.textContent = err.message;
      }
    });

    logoutBtn.addEventListener("click", async () => {
      await fetch("/api/auth/logout", { method: "POST" });
      location.reload();
    });

    async function post(url, body, signal) {
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body),
        signal,
      });
      if (res.status === 401 && !url.startsWith("/api/auth/login")) showLogin();
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(err.detail || `Request failed (${res.status})`);
      }
      return res;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      addFromInput();
      if (!interests.length) return;
      errorEl.classList.remove("show");
      resultEl.classList.remove("show");
      scriptEl.innerHTML = "";
      player.removeAttribute("src");
      playerCard.classList.remove("playing");
      speechSynthesis.cancel();
      currentLine = -1;
      noteEl.textContent = "";
      browserBtn.disabled = true;
      stepsEl.classList.add("show");
      go.disabled = true;
      go.textContent = "Working...";
      const language = document.getElementById("language").value;
      try {
        setStep("script");
        const briefing = await (await post("/api/generate-briefing", { user_interests: interests, language })).json();
        lastBriefing = briefing;
        lastLanguage = language;

        titleEl.textContent = briefing.title;
        metaEl.textContent = `${briefing.script.length} lines \u00b7 ${interests.join(" \u00b7 ")}`;
        briefing.script.forEach((line, i) => {
          const isA = line.speaker === "Agent Anna";
          const row = document.createElement("div");
          row.className = "line " + (isA ? "a" : "b");
          row.style.animationDelay = `${Math.min(i * 40, 600)}ms`;
          const avatar = document.createElement("div");
          avatar.className = "avatar";
          avatar.textContent = isA ? "AA" : "AS";
          const body = document.createElement("div");
          const who = document.createElement("div");
          who.className = "who";
          who.textContent = line.speaker;
          const text = document.createElement("div");
          text.className = "text";
          text.textContent = line.text;
          body.append(who, text);
          row.append(avatar, body);
          scriptEl.append(row);
        });
        resultEl.classList.add("show");

        setStep("audio");
        browserBtn.disabled = false;
        const controller = new AbortController();
        const timer = setTimeout(() => controller.abort(), AUDIO_TIMEOUT_MS);
        try {
          const { segments } = await (await post("/api/briefing/audio", briefing, controller.signal)).json();
          await loadSegments(segments);
          finishSteps();
          player.play().catch(() => {});
        } catch (err) {
          const reason = err.name === "AbortError" ? "took too long" : err.message;
          noteEl.textContent = `Server voice unavailable (${reason}). Playing with browser voice.`;
          finishSteps();
          await speakInBrowser(briefing, language);
        } finally {
          clearTimeout(timer);
        }
      } catch (err) {
        stepsEl.classList.remove("show");
        errorEl.textContent = err.message;
        errorEl.classList.add("show");
      } finally {
        go.disabled = interests.length === 0;
        go.textContent = "Generate briefing";
      }
    });

    browserBtn.addEventListener("click", () => {
      if (speechSynthesis.speaking) {
        speechSynthesis.cancel();
        return;
      }
      if (lastBriefing) speakInBrowser(lastBriefing, lastLanguage).catch((err) => { noteEl.textContent = err.message; });
    });

    player.addEventListener("play", () => playerCard.classList.add("playing"));
    player.addEventListener("pause", () => playerCard.classList.remove("playing"));
    checkSession();

    player.addEventListener("timeupdate", () => {
      let idx = -1;
      lineStarts.forEach((s, i) => { if (player.currentTime >= s) idx = i; });
      highlight(idx);
    });
    player.addEventListener("ended", () => {
      playerCard.classList.remove("playing");
      currentLine = -1;
      scriptEl.querySelectorAll(".line.now").forEach((r) => r.classList.remove("now"));
    });
  </script>
</body>
</html>
